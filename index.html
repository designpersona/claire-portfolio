<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff5a00" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Design Persona — Rebuilding</title>
  <meta name="description" content="Design Persona is being rebuilt. For project and collaboration inquiries, please contact by email." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Design Persona — Rebuilding" />
  <meta property="og:description" content="The portfolio is temporarily closed while Design Persona is being rebuilt." />
  <link rel="icon" href="./assets/icons/favicon2.png" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Microsoft Clarity: 기존 프로젝트를 유지해 공사중 모드 전후의 행동을 비교한다. -->
  <script>
    (function(c,l,a,r,i,t,y){
      c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
      t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
      y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "unahd0ky9n");
  </script>

  <style>
    :root {
      color-scheme: light;
      --ink: #111111;
      --paper: #f4efe7;
      --accent: #ff5a00;
      --line: rgba(17, 17, 17, 0.22);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Outfit", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a { color: inherit; }

    .page {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    .topbar,
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 20px clamp(20px, 4vw, 64px);
      border-color: var(--line);
    }

    .topbar { border-bottom: 1px solid var(--line); }
    .footer { border-top: 1px solid var(--line); }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .brand-mark {
      width: 24px;
      height: 24px;
      flex: none;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .status::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      content: "";
      animation: pulse 1.8s ease-in-out infinite;
    }

    .main {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(280px, 0.8fr);
      min-height: 0;
    }

    .message {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 48px;
      padding: clamp(36px, 6vw, 96px) clamp(20px, 4vw, 64px);
    }

    .eyebrow {
      margin: 0 0 18px;
      font-size: clamp(12px, 1vw, 14px);
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 1040px;
      margin: 0;
      font-size: clamp(54px, 9.6vw, 150px);
      font-weight: 600;
      letter-spacing: -0.065em;
      line-height: 0.82;
    }

    h1 span { color: var(--accent); }

    .summary {
      max-width: 620px;
      margin: 0;
      font-size: clamp(18px, 2vw, 28px);
      line-height: 1.35;
      letter-spacing: -0.025em;
      text-wrap: balance;
    }

    .contact-panel {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: clamp(28px, 4vw, 64px);
      background: var(--accent);
      border-left: 1px solid var(--ink);
    }

    .contact-label {
      margin: 0 0 auto;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .contact-copy {
      margin: 0 0 28px;
      font-size: clamp(22px, 2.8vw, 40px);
      font-weight: 500;
      line-height: 1.08;
      letter-spacing: -0.04em;
      text-wrap: balance;
    }

    .contact-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 62px;
      padding: 17px 0;
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
      font-size: clamp(15px, 1.5vw, 19px);
      font-weight: 600;
      text-decoration: none;
    }

    .contact-link svg {
      width: 22px;
      height: 22px;
      transition: transform 180ms ease;
    }

    .contact-link:hover svg,
    .contact-link:focus-visible svg { transform: translate(4px, -4px); }

    .contact-link:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 5px;
    }

    .footer {
      font-size: 12px;
      line-height: 1.5;
    }

    .footer p { margin: 0; }
    .footer p:last-child { text-align: right; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.38; transform: scale(0.78); }
    }

    @media (max-width: 760px) {
      .page { min-height: 100dvh; }
      .topbar { padding-block: 16px; }
      .brand-mark { width: 22px; height: 22px; }
      .main { grid-template-columns: 1fr; }
      .message { min-height: 58svh; }
      h1 { font-size: clamp(58px, 20vw, 96px); }
      .contact-panel {
        min-height: 42svh;
        border-top: 1px solid var(--ink);
        border-left: 0;
      }
      .contact-label { margin-bottom: 72px; }
      .footer { align-items: flex-start; }
      .footer p:last-child { max-width: 190px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .status::before { animation: none; }
      .contact-link svg { transition: none; }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="topbar">
      <div class="brand" aria-label="Design Persona">
        <svg class="brand-mark" viewBox="0 0 50 50" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M12.35 0h9.15c4.15 0 7.2 3.12 7.72 7.48H25c-7.1 0-12.15-2.78-12.65-7.48Z"></path>
          <circle cx="25" cy="30.85" r="16.9" fill="none" stroke="currentColor" stroke-width="4.15"></circle>
        </svg>
        <span>Design Persona</span>
      </div>
      <div class="status">Rebuilding</div>
    </header>

    <main class="main">
      <section class="message" aria-labelledby="pageTitle">
        <div>
          <p class="eyebrow">Portfolio temporarily closed</p>
          <h1 id="pageTitle">Under<br /><span>rebuild.</span></h1>
        </div>
        <p class="summary">
          포트폴리오를 잠시 닫았습니다.<br />
          새로운 구조와 새로운 작업으로 곧 돌아옵니다.
        </p>
      </section>

      <aside class="contact-panel" aria-labelledby="contactTitle">
        <p class="contact-label">Project / Collaboration</p>
        <p class="contact-copy" id="contactTitle">
          특정 작업을 보러 오셨거나 함께할 일이 있다면 바로 알려주세요.
        </p>
        <a class="contact-link" id="emailInquiry" href="mailto:designpersona.kr@gmail.com">
          <span>designpersona.kr@gmail.com</span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 19 19 5M9 5h10v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>
      </aside>
    </main>

    <footer class="footer">
      <p>© 2026 Gyuri Min</p>
      <p>Privacy-protected session analytics are used to improve this site.</p>
    </footer>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var hashRoute = (window.location.hash || "#/").replace(/^#\/?/, "") || "home";
      var referrerHost = "direct";

      try {
        if (document.referrer) referrerHost = new URL(document.referrer).hostname || "referral";
      } catch (error) {
        referrerHost = "referral";
      }

      var source = params.get("utm_source") || params.get("ref") || params.get("from") || referrerHost;
      var medium = params.get("utm_medium") || (source === "direct" ? "none" : "referral");
      var campaign = params.get("utm_campaign") || "portfolio_lock";
      var content = params.get("utm_content") || hashRoute;

      var safe = function (value) {
        return String(value || "unknown").slice(0, 120);
      };

      window.clarity("set", "site_mode", "construction");
      window.clarity("set", "entry_source", safe(source));
      window.clarity("set", "entry_medium", safe(medium));
      window.clarity("set", "entry_campaign", safe(campaign));
      window.clarity("set", "entry_content", safe(content));
      window.clarity("set", "invite_id", safe(params.get("invite_id") || "none"));
      window.clarity("set", "entry_route", safe(hashRoute));
      window.clarity("set", "portfolio_access", params.get("access") === "denied" ? "denied" : "construction");
      window.clarity("event", "construction_view");

      [5, 15, 30].forEach(function (seconds) {
        window.setTimeout(function () {
          window.clarity("event", "stay_" + String(seconds).padStart(2, "0") + "s");
        }, seconds * 1000);
      });

      var email = document.getElementById("emailInquiry");
      var subject = "[Design Persona] Portfolio inquiry";
      var body = [
        "안녕하세요. Design Persona 포트폴리오를 보고 문의드립니다.",
        "",
        "보고 싶었던 작업 / 문의 내용:",
        "",
        "---",
        "Entry reference: " + safe(source) + " / " + safe(content)
      ].join("\n");

      email.href = "mailto:designpersona.kr@gmail.com?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
      email.addEventListener("click", function () {
        window.clarity("event", "email_inquiry_click");
      });
    })();
  </script>
</body>
</html>
