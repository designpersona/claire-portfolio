<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Design Persona — Opening portfolio</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f4efe7;
      color: #111;
    }

    p {
      margin: 0;
      font-size: 14px;
      letter-spacing: 0.04em;
    }
  </style>
  <script>
    (function () {
      var hashCode = (window.location.hash || '').replace(/^#\/?/, '');
      var queryCode = new URLSearchParams(window.location.search).get('k') || '';
      var code = (hashCode || queryCode).trim().toLowerCase();

      var showNotFound = function () {
        var render = function () {
          document.title = '404 — Link not found';
          var message = document.getElementById('statusMessage');
          if (message) message.textContent = '404 — Link not found.';
        };
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', render, { once: true });
        } else {
          render();
        }
      };

      if (!/^[a-z0-9]{6,24}$/.test(code)) {
        showNotFound();
        return;
      }

      fetch('./links.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (response) {
          if (!response.ok) throw new Error('registry_unavailable');
          return response.json();
        })
        .then(function (registry) {
          var entry = registry && registry.links && registry.links[code];
          if (!entry || entry.active !== true) {
            showNotFound();
            return;
          }

          var target = new URLSearchParams({
            utm_source: entry.platform,
            utm_medium: 'job_application',
            utm_campaign: entry.campaign,
            utm_content: entry.company + '_' + entry.role,
            application_company: entry.company,
            application_platform: entry.platform,
            company_type: entry.company_type,
            application_role: entry.role,
            application_date: entry.applied_at,
            application_sequence: String(entry.annual_sequence),
            invite_id: code
          });
          window.location.replace('/portfolio.html?' + target.toString() + '#/archive');
        })
        .catch(function () {
          showNotFound();
        });
    })();
  </script>
</head>
<body>
  <p id="statusMessage">Opening portfolio…</p>
</body>
</html>
